<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React App</title>
    <!-- Tailwind CSS for base resets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Center everything on the screen */
      body {
        background-color: #0b0f19;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: sans-serif;
      }

      /* Container for page wrap */
      .app-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 18rem;
      }

      /* Navigation button bar container */
      .nav {
        display: flex;
        gap: 0.5rem;
        width: 100%;
        margin-bottom: 1rem;
      }

      /* Base navigation button styles */
      .nav-btn {
        flex: 1;
        padding: 0.5rem;
        border-radius: 0.75rem;
        font-weight: bold;
        background: #1e293b;
        color: #94a3b8;
        border: none;
        cursor: pointer;
      }

      /* Active navigation tab highlight */
      .nav-active {
        background: #38bdf8;
        color: #0f172a;
      }

      /* Main dark card wrapper */
      .card {
        background: #182232;
        border-radius: 1.5rem;
        padding: 1.25rem;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        box-sizing: border-box;
      }

      /* Card Headers */
      .title {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 800;
        color: #38bdf8;
        margin-bottom: 1rem;
        margin-top: 0;
      }

      /* Calculator Screen Display */
      .screen {
        background: #080c14;
        color: #4ade80;
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
        text-align: right;
        font-family: monospace;
        font-size: 1.75rem;
        height: 4rem;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        margin-bottom: 1rem;
      }

      /* Calculator Button Grid */
      .calc-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.5rem;
        font-weight: bold;
      }

      .btn-c {
        padding: 0.75rem 0;
        border-radius: 0.6rem;
        text-align: center;
        font-weight: 800;
        font-size: 1.1rem;
        border: none;
        cursor: pointer;
      }

      .b-num { background: #2a374a; color: white; }
      .b-op { background: #d97706; color: white; }
      .b-clear { background: #e11d48; color: white; grid-column: span 3; }
      .b-eq { background: #16a34a; color: white; }
      .b-zero { grid-column: span 2; }

      /* Task Manager Styles */
      .todo-form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }

      .todo-input {
        background: #080c14;
        border: 1px solid #2a374a;
        border-radius: 0.5rem;
        padding: 0.5rem;
        width: 100%;
        outline: none;
        color: white;
        font-size: 0.875rem;
      }

      .todo-add {
        background: #38bdf8;
        color: #0f172a;
        font-weight: 800;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        border: none;
        cursor: pointer;
      }

      .todo-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #080c14;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
      }

      .todo-del {
        color: #f43f5e;
        font-weight: bold;
        background: #f43f5e20;
        padding: 0.1rem 0.4rem;
        border-radius: 0.25rem;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
